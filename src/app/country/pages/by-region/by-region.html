<h1 class="text-2xl">By Region</h1>
<h3 class="text-lg">Select a region</h3>

<section class="row mt-1">
  <div class="flex-col">
    @for (region of regions; track region) {
    <button class="btn btn-outline mr-2 w-30" [class.btn-primary]="selectedRegion() === region"
      (click)="selectedRegion.set(region)">
      {{ region }}
    </button>
    }
  </div>
</section>

<country-list [countries]="countryResource.hasValue() ? countryResource.value() : []"
  [errorMessage]="countryResource.error()" [isLoading]="countryResource.isLoading()"
  [isEmpty]="countryResource.hasValue() ? countryResource.value()!.length === 0 : false" />
